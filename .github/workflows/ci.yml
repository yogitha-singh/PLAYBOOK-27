name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt ruff
      - run: ruff check backend scripts --select E9,F63,F7,F82
      - name: unit tests (analytics-output tests skip when processed data is absent)
        run: cd backend && python -m unittest discover -s tests -t . -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd frontend && for f in js/*.js js/pages/*.js; do node --check "$f"; done
      - name: unit tests (live-API page tests skip when pipeline outputs are absent)
        run: cd frontend && node --test tests/*.test.js
